[project]
name = "marketplace-api"
version = "0.1.0"
description = "FastAPI backend for the marketplace"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.143,<0.144",
    "httpx2>=2.13.1",
    "pillow>=11",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs the local Supabase stack (npm run db:start)"]
