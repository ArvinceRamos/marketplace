name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; CI never needs write access or real secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies (locked)
        run: |
          uv sync --locked --directory backend
          npm ci
      - name: Ruff format check
        run: uv run --directory backend ruff format --check .
      - name: Ruff lint
        run: uv run --directory backend ruff check .
      # A throwaway local Supabase on the runner: migrations + seed, a fresh
      # signing key, and the CLI's local demo keys. No real secrets involved.
      - name: Start local Supabase
        run: |
          npm run db:keys
          npx supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
      - name: Tests (unit + integration)
        env:
          REQUIRE_INTEGRATION: "1"
        run: uv run --directory backend pytest
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (locked)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        # Public, non-secret placeholders. Pages fetch API data at request time,
        # so the build never contacts these addresses.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54421
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Simple check (SECURITY_PLAN T16): Supabase secret keys, private keys (PEM or the
      # JWK "d" field), and full JWTs must never be committed. GitHub secret scanning
      # is the second check once the repo is on GitHub.
      - name: No secrets in tracked files
        run: |
          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|eyJhbGci[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{20,}|"d"\s*:\s*"[A-Za-z0-9_-]{40,}"'; then
            echo "::error::Possible secret in a tracked file (see lines above)."
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build API image
        run: docker build -t marketplace-api:ci backend
      - name: Health check
        run: |
          docker run -d --name api -p 8000:8000 marketplace-api:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/api/v1/health && exit 0
            sleep 2
          done
          docker logs api
          exit 1
